#
# release — thin caller of the shared release path (reusable-release.yml). Every repo built on
# ansible-devkit has this same file, pinned to a devkit tag; devkit calls its own copy with ./.
name: release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release:
    uses: ./.github/workflows/reusable-release.yml
    with:
      kind: python
    # The publish job's `release`-environment secrets reach a reusable workflow only when the
    # caller passes secrets through; without this the App key arrives empty.
    secrets: inherit
    permissions:
      contents: read
