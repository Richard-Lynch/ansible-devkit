#
# ci — thin caller of the shared CI gate (reusable-ci.yml). The job id `ci` makes the required
# status check `ci / gate`; every repo built on ansible-devkit has this same file.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/reusable-ci.yml
    with:
      kind: python
