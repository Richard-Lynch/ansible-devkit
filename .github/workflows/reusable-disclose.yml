# SPDX-License-Identifier: GPL-3.0-or-later
#
# reusable-disclose — run the disclosure gate's GENERIC rules on every pull request, for every repo
# built on ansible-devkit, with no private input at all.
#
# Caller (thin `disclose.yml` in each repo; devkit itself uses ./). The caller's job id MUST be
# `disclose`: the required status check is named `disclose / gate`. It passes NO secrets.
#   on: {pull_request: {types: [opened, synchronize, reopened, edited]}}
#   jobs:
#     disclose:
#       uses: Richard-Lynch/ansible-devkit/.github/workflows/reusable-disclose.yml@v0.3.1
#
# The private repository that publishes here runs the SAME scanner before any push, with two
# private inputs added (its own literals, its known secret values). This workflow is the public
# half: the generic rules (private address ranges, device MACs, email addresses, SteamID64s,
# op:// references), gitleaks and trufflehog, over what the pull request ADDS (`--since` its base),
# so that a change made outside the publisher's gate — a web edit, a fork, an un-hooked push —
# still meets the rules that need no estate knowledge. Nothing private is reachable from here.
#
# FAILS CLOSED. A scanner that cannot be installed, a base that cannot be resolved, a gate error:
# a failed run, never a skipped step.
#
# THE PR IS DATA, NEVER CODE. The pull request is checked out into scan/ and only read. `devkit` is
# installed from a TRUSTED commit — this shared workflow's own commit (job.workflow_sha) or, when a
# repository calls its own copy (devkit itself), the PR's BASE commit — so a PR cannot change the
# implementation that judges it. The exemptions for the repository's own fixtures come from
# `.disclose-allow` at the PR's BASE, never from the PR head, so a PR cannot widen the exemptions
# that judge it; a new fixture exemption lands in its own pull request first.
#
# `--allow-missing secrets-cache`: the known-secret-VALUE check needs the publisher's private
# credential cache, which CI never has. It runs in the publisher's own gate before every push.
name: reusable-disclose

on:
  workflow_call:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  TRUFFLEHOG_VERSION: 3.99.3
  TRUFFLEHOG_SHA256: 029b182e0ed35fd5b02cd1eadc2a94bd457ab14ad22a9380b6e5d9652261d28d

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: scan
          # The gate reads every blob the PR adds and, without a base, the whole history.
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - name: Install the scanners (pinned, checksummed)
        run: |
          set -euo pipefail
          mkdir -p "$HOME/bin"
          curl -fsSL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz -C "$HOME/bin" gitleaks
          curl -fsSL -o trufflehog.tgz "https://github.com/trufflesecurity/trufflehog/releases/download/v${TRUFFLEHOG_VERSION}/trufflehog_${TRUFFLEHOG_VERSION}_linux_amd64.tar.gz"
          echo "${TRUFFLEHOG_SHA256}  trufflehog.tgz" | sha256sum -c -
          tar -xzf trufflehog.tgz -C "$HOME/bin" trufflehog
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Choose the trusted devkit commit
        id: trusted
        env:
          WF_REPO: ${{ job.workflow_repository }}
          WF_SHA: ${{ job.workflow_sha }}
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [ "$WF_REPO" = "$REPO" ]; then
            # The base commit is trusted ONLY when it is the protected default branch: a PR into any
            # other branch could name a base the PR author controls.
            [ "$BASE_REF" = "$DEFAULT_BRANCH" ] || { echo "::error::PR base '$BASE_REF' is not the default branch '$DEFAULT_BRANCH'"; exit 1; }
            sha="$BASE_SHA"
          else
            sha="$WF_SHA"
          fi
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::no trusted devkit commit ('$sha')"; exit 1; }
          echo "devkit at $sha (workflow repo $WF_REPO)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Check out devkit at the trusted commit (its own lockfile decides every dependency)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Richard-Lynch/ansible-devkit
          ref: ${{ steps.trusted.outputs.sha }}
          path: devkit
          persist-credentials: false
      - name: Install devkit from its lockfile
        env:
          UV_NO_CACHE: "1"
        run: uv sync --frozen --no-dev --project devkit
      - name: Read the exemptions from the pull request's BASE (never from the PR)
        id: allow
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          # Only a base on the protected default branch is trusted to supply exemptions (and to be
          # "already public" for --since); any other base gets neither.
          if [ "$BASE_REF" != "$DEFAULT_BRANCH" ] || ! [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "base '$BASE_REF' is not the default branch '$DEFAULT_BRANCH': full scan, no exemptions"
            echo "since=" >> "$GITHUB_OUTPUT"
            echo "allow=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "since=$BASE_SHA" >> "$GITHUB_OUTPUT"
          if git -C scan cat-file -e "${BASE_SHA}:.disclose-allow" 2>/dev/null; then
            git -C scan show "${BASE_SHA}:.disclose-allow" > "${RUNNER_TEMP}/allow.txt"
            n=$(grep -cvE '^\s*(#|$)' "${RUNNER_TEMP}/allow.txt" || true)
            echo ".disclose-allow at the base: $n exemption line(s)"
            echo "allow=${RUNNER_TEMP}/allow.txt" >> "$GITHUB_OUTPUT"
          else
            echo "no .disclose-allow at the base: no exemptions"
            echo "allow=" >> "$GITHUB_OUTPUT"
          fi
      - name: devkit disclose
        env:
          # The merge commit CI checked out: reachable from the PR's merge ref.
          SHA: ${{ github.sha }}
          SINCE: ${{ steps.allow.outputs.since }}
          ALLOW: ${{ steps.allow.outputs.allow }}
          UV_NO_CACHE: "1"
        run: |
          set -euo pipefail
          args=()
          [ -n "$SINCE" ] && args+=(--since "$SINCE")
          [ -n "$ALLOW" ] && args+=(--allow "$ALLOW")
          uv run --frozen --no-dev --project devkit \
            devkit disclose --repo "$GITHUB_WORKSPACE/scan" --sha "${SHA}" \
            --allow-missing secrets-cache \
            "${args[@]}" \
            --report "${RUNNER_TEMP}/disclose-report.json"
      - name: Report (findings name a rule and a location, never a value)
        if: always()
        run: |
          set -euo pipefail
          test -f "${RUNNER_TEMP}/disclose-report.json" && cat "${RUNNER_TEMP}/disclose-report.json"
