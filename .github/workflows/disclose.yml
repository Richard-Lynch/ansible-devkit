#
# disclose — thin caller of the shared disclosure gate (reusable-disclose.yml). The job id
# `disclose` makes the required status check `disclose / gate`. It passes no secrets: the gate's
# generic rules need no private input, and the repository's own fixture exemptions come from
# `.disclose-allow` at the pull request's base.
name: disclose

on:
  pull_request:
    # `edited` re-runs the gate when a PR is retargeted to another base branch.
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  disclose:
    uses: ./.github/workflows/reusable-disclose.yml
